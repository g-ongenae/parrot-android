name: Native builds
on: [push, pull_request, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android assembleDebug lintDebug
      - run: mkdir -p /tmp/parrot-tests && javac -d /tmp/parrot-tests android/app/src/main/java/dev/parrot/mobile/TextTools.java tests/TextToolsTest.java && java -cp /tmp/parrot-tests dev.parrot.mobile.TextToolsTest
      - uses: actions/upload-artifact@v4
        with:
          name: parrot-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate && xcodebuild -project Parrot.xcodeproj -scheme Parrot -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
